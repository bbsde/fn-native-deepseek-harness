# Dual-architecture fpk build on GitHub's native runners.
#
# - x86_64 job runs on a regular x64 runner; arm64 job runs on the native
#   arm64 hosted runner (ubuntu-24.04-arm) — the runtime tree installs at
#   native speed with no QEMU/proxy/mirror setup. npm resolves arch-specific
#   optional deps (ripgrep) correctly on both.
# - fnpack (the fnOS packaging tool, a Go binary) has no npm package; the
#   official CDN serves per-platform builds which we drop into PATH.
#
# Artifacts: every run uploads dist/*.fpk per arch. Pushing a tag (v*)
# additionally creates a GitHub Release with both fpks attached.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'dsh version to build (e.g. 0.1.0-rc.6); empty = pinned dshVersion'
        required: false
        default: ''
      wrapper_build:
        description: 'wrapper re-release suffix (e.g. 2 -> 0.1.0-rc.6.2); empty = none'
        required: false
        default: ''

permissions:
  contents: write

env:
  FNPACK_VERSION: '1.2.3'

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            fnpack_platform: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            fnpack_platform: linux-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install native toolchain (node-pty compiles from source)
        run: sudo apt-get update && sudo apt-get install -y g++ make python3

      - name: Install fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-${{ matrix.fnpack_platform }}"
          chmod +x /usr/local/bin/fnpack
          fnpack 2>&1 | head -2 || true

      - name: Resolve versions
        id: ver
        run: |
          version='${{ github.event.inputs.version }}'
          wrapper='${{ github.event.inputs.wrapper_build }}'
          [ -n "$version" ] || version="$(node -p "require('./package.json').dshVersion")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wrapper=$wrapper" >> "$GITHUB_OUTPUT"

      - name: Build fpk (${{ matrix.arch }})
        env:
          DSH_ARCHS: ${{ matrix.arch }}
          DSH_WRAPPER_BUILD: ${{ steps.ver.outputs.wrapper }}
        run: |
          if [ -z "${DSH_WRAPPER_BUILD}" ]; then unset DSH_WRAPPER_BUILD; fi
          ./build.sh "${{ steps.ver.outputs.version }}"

      - name: Verify fpk arch markers
        run: |
          for f in dist/*.fpk; do
            echo "== $f =="
            ls -la "$f"
            # runtime tar inside must carry the right-arch rg/pty; build.sh
            # already hard-fails on e_machine mismatch, this is a belt check.
            grep -o 'platform=[a-z0-9]*' src/manifest || true
          done

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-fpk-${{ matrix.arch }}
          path: |
            dist/*.fpk
            dist/*.fpk.info.txt
          if-no-files-found: error

  release:
    name: release (tag)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: dsh-fpk-*
          merge-multiple: true

      - name: Create release with fpks
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-all/*.fpk
            dist-all/*.fpk.info.txt
          generate_release_notes: true
