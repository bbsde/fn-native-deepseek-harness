# Manual tag-driven dual-architecture fpk release.
#
# The git tag is the single version source — nothing is edited by hand:
#   git tag v0.1.0-rc.6.4 && git push --tags
#     -> builds x86_64 + arm64 fpks on native runners
#     -> creates a GitHub Release with both fpks attached
#
# Tag format: v<upstream-dsh-version>[.<wrapper-revision>], e.g.
#   v0.1.0-rc.7     first release of upstream 0.1.0-rc.7
#   v0.1.0-rc.6.4   wrapper re-release of upstream 0.1.0-rc.6
# The upstream part is resolved by comparing against the pinned package.json
# dshVersion (see "Resolve versions from tag").
#
# Pushes to main do NOT build. Scheduled upstream follows are handled by
# auto-follow.yml; the heavy lifting lives in the reusable build-fpk.yml.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      appver:
        description: 'full fpk version (e.g. 0.1.0-rc.6.4)'
        required: true
      upstream:
        description: 'upstream dsh version (e.g. 0.1.0-rc.6)'
        required: true

permissions:
  contents: write

jobs:
  resolve:
    name: resolve versions
    runs-on: ubuntu-latest
    outputs:
      appver: ${{ steps.ver.outputs.appver }}
      upstream: ${{ steps.ver.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions from tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            appver='${{ github.event.inputs.appver }}'
            upstream='${{ github.event.inputs.upstream }}'
          else
            appver="${GITHUB_REF_NAME#v}"
            pinned="$(node -p "require('./package.json').dshVersion")"
            no_last="${appver%.*}"
            if [ "$no_last" != "$appver" ] && [ "$no_last" = "$pinned" ]; then
              upstream="$no_last"
            else
              upstream="$appver"
            fi
          fi
          echo "appver=$appver" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "resolved: appver=$appver upstream=$upstream"

  build:
    name: build
    needs: resolve
    uses: ./.github/workflows/build-fpk.yml
    with:
      appver: ${{ needs.resolve.outputs.appver }}
      upstream: ${{ needs.resolve.outputs.upstream }}

  release:
    name: release
    needs: [resolve, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: dsh-fpk-*
          merge-multiple: true

      - name: Create release with fpks
        uses: softprops/action-gh-release@v2
        with:
          files: dist-all/*.fpk
          generate_release_notes: true
